<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Spürnase – Detektivbüro Bärenmoos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Detektiv- und Polizeispiel für Kinder ab 8 Jahren. Spuren sichern, Zeugen befragen, Fälle lösen.">
<meta name="theme-color" content="#0e1a2b">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spürnase">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app" aria-live="polite"></div>

<div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet__backdrop" data-close-sheet></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__grip"></div>
    <h2 id="sheetTitle" class="sheet__title"></h2>
    <div id="sheetBody" class="sheet__body"></div>
    <button class="btn btn--wide" data-close-sheet>Schliessen</button>
  </div>
</div>

<noscript>
  <p style="padding:2rem;color:#fff;font:1rem system-ui">
    Für dieses Spiel muss JavaScript eingeschaltet sein.
  </p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
